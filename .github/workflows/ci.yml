name: CI Pipeline

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─────────────────────────────────────────────────────────────
  # 1. Frontend Quality Check (Expo / React Native)
  # ─────────────────────────────────────────────────────────────
  frontend-check:
    name: Frontend (Typecheck & Lint)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: TypeScript Type Check
        run: npx tsc --noEmit

      - name: ESLint Code Quality
        run: npm run lint

  # ─────────────────────────────────────────────────────────────
  # 2. Admin Dashboard Check (Vite / React)
  # ─────────────────────────────────────────────────────────────
  admin-check:
    name: Admin Dashboard (Lint & Build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: admin

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: admin/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Run Oxlint
        run: npm run lint

      - name: Production Build Test
        run: npm run build

  # ─────────────────────────────────────────────────────────────
  # 3. Backend API Check (FastAPI / Pytest)
  # ─────────────────────────────────────────────────────────────
  backend-check:
    name: Backend API (Pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      ENVIRONMENT: development
      ALLOW_ADMIN_TEST_LOGIN: "1"
      SUPABASE_URL: ${{ secrets.SUPABASE_URL || 'https://placeholder.supabase.co' }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || 'dummy_service_role_key' }}
      SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY || 'dummy_publishable_key' }}
      GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY || 'dummy_google_maps_key' }}
      TEST_EMAIL: ${{ secrets.TEST_EMAIL || '' }}
      TEST_PASSWORD: ${{ secrets.TEST_PASSWORD || '' }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Unit & Integration Tests (Pytest)
        run: pytest -v
