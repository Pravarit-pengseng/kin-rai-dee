services:
  # 1. FastAPI Backend Service (Port 8000)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: kin-rai-dee-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    volumes:
      - ./backend/app:/app/app
      - ./backend/tests:/app/tests
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  # 2. Vite React Admin Dashboard (Port 5173)
  admin:
    build:
      context: ./admin
      dockerfile: Dockerfile
    container_name: kin-rai-dee-admin
    restart: unless-stopped
    ports:
      - "5173:5173"
    env_file:
      - ./admin/.env
    volumes:
      - ./admin/src:/app/src
      - ./admin/public:/app/public
      - ./admin/index.html:/app/index.html
      - ./admin/vite.config.ts:/app/vite.config.ts
      - ./admin/.env:/app/.env
    environment:
      - VITE_BACKEND_URL=http://backend:8000
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # 3. Expo Frontend Web (Port 8081)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: kin-rai-dee-frontend
    restart: unless-stopped
    ports:
      - "8081:8081"
    volumes:
      - ./frontend/app:/app/app
      - ./frontend/components:/app/components
    extra_hosts:
      - "host.docker.internal:host-gateway"
